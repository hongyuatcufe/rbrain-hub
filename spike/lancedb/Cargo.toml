[workspace]

[package]
name = "lancedb-spike"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "spike"
path = "src/main.rs"

[dependencies]
lancedb = "0.17"
arrow-array = "=53.4.1"
arrow-schema = "=53.4.1"
arrow-buffer = "=53.4.1"
tokio = { version = "1", features = ["full"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
